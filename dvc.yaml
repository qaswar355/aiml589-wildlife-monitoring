stages:
  manifest:
    cmd: python -m src.data.build_manifest
    deps:
      - src/data/build_manifest.py
      - src/data/species_map.py
      - src/data/events.py
      - configs/data/default.yaml
      - configs/data/species_taxonomy.yaml
      - configs/data/class_map.yaml
      - data/nz_flat.parquet
      - data/md_boxes.parquet
    outs:
      - data/manifest.csv

  ingest:
    cmd: python -m src.data.ingest
    deps:
      - src/data/ingest.py
      - data/manifest.csv
    outs:
      - data/shards/

  preprocess:
    cmd: python -m src.data.preprocessing
    deps:
      - src/data/preprocessing.py
      - data/manifest.csv
    outs:
      - data/processed/

  train:
    cmd: python -m src.training.train
    deps:
      - src/training/train.py
      - src/models/efficientnet.py
      - data/manifest.csv
      - data/shards/
      - configs/training/default.yaml
      - configs/model/efficientnet_b3.yaml
    outs:
      - models/checkpoint.pt

  evaluate:
    cmd: python -m src.training.evaluate
    deps:
      - src/training/evaluate.py
      - src/training/dataset.py
      - src/models/efficientnet.py
      - models/checkpoint.pt
      - data/manifest.csv
      - data/shards/
      - configs/inference/threshold_config.yaml
    outs:
      - data/predictions/test_predictions.csv
    metrics:
      - metrics/eval.json:
          cache: false
    plots:
      - metrics/roc_curve.csv:
          cache: false
      - metrics/pr_curve.csv:
          cache: false
