stages:
  manifest:
    cmd: python -m src.data.build_manifest
    deps:
      - src/data/build_manifest.py
      - src/data/species_map.py
      - src/data/events.py
      - configs/data/default.yaml
      - configs/data/species_taxonomy.yaml
      - configs/data/class_map.yaml
      - data/nz_flat.parquet
      - data/md_boxes.parquet
    outs:
      - data/manifest.csv

  ingest:
    cmd: python -m src.data.ingest
    deps:
      - src/data/ingest.py
      - data/manifest.csv
    outs:
      - data/shards/

  preprocess:
    cmd: python -m src.data.preprocessing
    deps:
      - src/data/preprocessing.py
      - data/manifest.csv
    outs:
      - data/processed/

  train_efficientnet_b3:
    cmd: python -m src.training.train configs/model/efficientnet_b3.yaml
    deps:
      - src/training/train.py
      - src/models/classifier.py
      - data/manifest.csv
      - data/shards/
      - configs/training/default.yaml
      - configs/model/efficientnet_b3.yaml
    outs:
      - models/checkpoint_efficientnet_b3.pt

  evaluate_efficientnet_b3:
    cmd: python -m src.training.evaluate efficientnet_b3
    deps:
      - src/training/evaluate.py
      - src/training/dataset.py
      - src/models/classifier.py
      - models/checkpoint_efficientnet_b3.pt
      - data/manifest.csv
      - data/shards/
      - configs/inference/threshold_config.yaml
    outs:
      - data/predictions/test_predictions_efficientnet_b3.csv
    metrics:
      - metrics/efficientnet_b3/eval.json:
          cache: false
    plots:
      - metrics/efficientnet_b3/roc_curve.csv:
          cache: false
      - metrics/efficientnet_b3/pr_curve.csv:
          cache: false

  train_resnet50:
    cmd: python -m src.training.train configs/model/resnet50.yaml
    deps:
      - src/training/train.py
      - src/models/classifier.py
      - data/manifest.csv
      - data/shards/
      - configs/training/default.yaml
      - configs/model/resnet50.yaml
    outs:
      - models/checkpoint_resnet50.pt

  evaluate_resnet50:
    cmd: python -m src.training.evaluate resnet50
    deps:
      - src/training/evaluate.py
      - src/training/dataset.py
      - src/models/classifier.py
      - models/checkpoint_resnet50.pt
      - data/manifest.csv
      - data/shards/
      - configs/inference/threshold_config.yaml
    outs:
      - data/predictions/test_predictions_resnet50.csv
    metrics:
      - metrics/resnet50/eval.json:
          cache: false
    plots:
      - metrics/resnet50/roc_curve.csv:
          cache: false
      - metrics/resnet50/pr_curve.csv:
          cache: false
