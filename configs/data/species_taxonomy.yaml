# Reference taxonomic grouping for the 97 species categories present in the
# LILA "Trail Camera Images of New Zealand Animals" metadata
# (data/nz_flat.parquet, category column). This is the stable biological
# ground truth and should not need to change; the *label* used for the
# current experiment (mammal vs bird, predator vs native, etc.) is defined
# separately in class_map.yaml and can be swapped freely without touching
# this file.
#
# Do not rename, correct, or re-key any species string here — they must
# match the raw dataset values exactly, including `grey_faced_petrol`,
# which is a misspelling of "petrel" in the source metadata.
#
# Fields per species:
#   taxon:  mammal | bird | other   — exhaustive, mutually exclusive
#   native: true/false/null — indigenous to Aotearoa NZ. Species that
#     naturally self-colonised NZ (harrier, pukeko, silvereye,
#     white_faced_heron, spurwing_plover, swallow, swan/black swan) are
#     counted native, consistent with DOC's treatment of natural
#     colonisers as distinct from human-introduced species.
#   wild: true/false/null — false only for domestic/livestock species
#     that are incidentally photographed rather than part of a
#     self-sustaining wild population (cow, sheep, horse, dog, chicken).
#     Feral populations of introduced species (e.g. cat, pig, goat) are
#     wild=true.
#
# The four "other" categories (human, moth, lizard, skink) sit outside the
# mammal/bird task entirely and are dropped via class_map.yaml's `exclude`
# list. `moth`, `lizard`, and `skink` are dataset-level groupings that are
# not resolved to a single species, so native/wild are left null for them
# rather than guessed; `human` is native: null (not an applicable concept),
# wild: false.
#
# Counts (asserted in src/data/species_map.py, not just trusted here):
#   mammal: 22   bird: 71   other: 4   total: 97

species:
  banded_dotterel:            {taxon: bird,   native: true,  wild: true}
  banded_rail:                {taxon: bird,   native: true,  wild: true}
  bellbird:                   {taxon: bird,   native: true,  wild: true}
  black_backed_gull:          {taxon: bird,   native: true,  wild: true}
  black_billed_gull:          {taxon: bird,   native: true,  wild: true}
  black_fronted_tern:         {taxon: bird,   native: true,  wild: true}
  blackbird:                  {taxon: bird,   native: false, wild: true}
  brown_creeper:               {taxon: bird,   native: true,  wild: true}
  canada_goose:                {taxon: bird,   native: false, wild: true}
  cat:                         {taxon: mammal, native: false, wild: true}
  chaffinch:                   {taxon: bird,   native: false, wild: true}
  chamois:                     {taxon: mammal, native: false, wild: true}
  chicken:                     {taxon: bird,   native: false, wild: false}
  cow:                         {taxon: mammal, native: false, wild: false}
  crake:                        {taxon: bird,   native: true,  wild: true}
  deer:                         {taxon: mammal, native: false, wild: true}
  dog:                          {taxon: mammal, native: false, wild: false}
